# Configuração base do LaringoPDI. Caminhos relativos à raiz do repositório.
paths:
  raw: data/raw/bagls
  index: data/index.csv
  groups: data/groups.csv
  splits: data/splits
  cache: data/processed/cache
  runs: results/runs
  results: results
  tables: results/tables
  docs: docs
  figures: docs/figures
  logs: logs

dataset: bagls            # bagls | laryngoscope8 (stub)

data:
  min_class_count: 50     # em vídeos
  image_size: 224
  # Lado maior máximo antes do PDI (padroniza a escala dos parâmetros; ver DECISIONS.md).
  work_size: 512
  frames_per_video: 10
  n_folds: 5
  split_seed: 42
  inner_val_frac: 0.15
  dedup:                  # vídeos quase-duplicados (frame central)
    phash_max_dist: 6
    ssim_min: 0.85
    thumb: 128

tasks:
  A: {name: healthy_vs_disorder, labels: [healthy, disorder]}
  B: {name: healthy_vs_structural, labels: [healthy, structural]}
  C: {name: healthy_functional_structural, labels: [healthy, functional, structural]}

segmentation:
  methods: [otsu, adaptive, otsu_morph, region_grow, watershed]
  preprocess: [raw, clahe, homo, bilat]
  tune_fold: 0            # fold cujo treino fixa método/parâmetros da técnica `roi`
  max_train_frames: 1500  # subamostra do treino para o ajuste (CPU)

train:
  augment: {hflip: 0.5, rotate_deg: 15, scale: [0.9, 1.1]}   # só geométrico
  loss: weighted_ce
  optimizer: adamw
  lr: {resnet18: 1.0e-4, simplecnn: 1.0e-3}
  weight_decay: 1.0e-4
  scheduler: cosine
  batch_size: 32
  epochs: 30
  epochs_fast: 10
  patience: 7
  monitor: f1_macro
  amp: true
  num_workers: 0
  seeds: [0, 1, 2]

probe:
  C: 1.0
  max_iter: 2000

simplecnn:
  filters: [32, 64, 128, 256]
  dropout: 0.3

classic:
  mlp: {hidden_layer_sizes: [256, 64], alpha: 1.0e-3, max_iter: 500, early_stopping: true}
  mlp18: {hidden_layer_sizes: [32, 16], activation: relu, solver: adam, early_stopping: true, max_iter: 2000}
  svm: {C: 1.0, gamma: scale}
  rf: {n_estimators: 500}
  permutation_repeats: 10

stats:
  alpha: 0.05
  n_boot: 2000
  neutral_band: 0.0   # veredito: p_holm >= alpha -> neutra; senão sinal da diferença mediana

colab:
  drive_root: /content/drive/MyDrive/LaringoPDI
  n_accounts: 5
  t4_budget_hours: 6
