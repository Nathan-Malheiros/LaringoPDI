# Configuração base do LaringoPDI. Caminhos relativos à raiz do repositório.
paths:
  raw: data/raw/bagls
  index: data/index.csv
  groups: data/groups.csv
  splits: data/splits
  cache: data/processed/cache
  runs: results/runs
  results: results
  tables: results/tables
  docs: docs
  figures: docs/figures
  logs: logs

dataset: bagls            # bagls | laryngoscope8 (stub)

data:
  min_class_count: 50     # em vídeos
  image_size: 224
  # Lado maior máximo antes do PDI (padroniza a escala dos parâmetros; ver DECISIONS.md).
  work_size: 512
  frames_per_video: 10
  n_folds: 5
  split_seed: 42
  inner_val_frac: 0.15
  dedup:                  # vídeos quase-duplicados (frame central)
    phash_max_dist: 6
    ssim_min: 0.85
    thumb: 128

tasks:
  A: {name: healthy_vs_disorder, labels: [healthy, disorder]}
  B: {name: healthy_vs_structural, labels: [healthy, structural]}
  C: {name: healthy_functional_structural, labels: [healthy, functional, structural]}

segmentation:
  methods: [otsu, adaptive, otsu_morph, adaptive_morph, region_grow, watershed]
  preprocess: [raw, stretch, he, clahe, mean, median, gauss_lpf, spec, homo]
  tune_fold: 0            # fold cujo treino fixa o melhor método e seus parâmetros
  max_train_frames: 1500  # subamostra do treino para o ajuste (CPU)

train:
  augment: {hflip: 0.5, rotate_deg: 15, scale: [0.9, 1.1]}   # só geométrico
  loss: weighted_ce
  optimizer: adamw
  lr: {resnet18: 1.0e-4}
  weight_decay: 1.0e-4
  scheduler: cosine
  batch_size: 32
  epochs: 30
  patience: 7
  monitor: f1_macro
  amp: true
  num_workers: 0
  seeds: [0, 1, 2]

classic:
  permutation_repeats: 10

mlp:
  class:   # CPU, 1 núcleo: entrada pequena; assim o tempo é comparável entre técnicas
    hidden18: [32, 16]
    hidden_pixels: [256, 64]
    lr: 1.0e-3
    weight_decay: 1.0e-4
    batch_size: 32
    epochs: 300
    patience: 20
    threads: 1
  seg:     # GPU: a inferência passa por todos os pixels de todos os frames
    patch: 15
    hidden: [64, 32]
    pixels_per_class: 200
    batch_size: 4096
    lr: 1.0e-3
    weight_decay: 1.0e-4
    epochs: 30
    patience: 5
    eval_frames: 100
    frames_per_batch: 8
    threshold: 0.5
    seed: 0

stats:
  alpha: 0.05
  n_boot: 2000
  neutral_band: 0.0   # veredito: p_holm >= alpha -> neutra; senão sinal da diferença mediana

app:
  # As cenas da demonstração ficam em app/streamlit_app.py (CENAS) e em docs/ROTEIRO_DEMO.md.
  fold: 0
