# Matriz de experimentos (BAGLS, escala de cinza). O PDI é a variável independente; todo o
# resto é fixo (base.yaml). pipeline: passos separados por ">" (registry em src/laringopdi/pdi).
# A conversão para cinza é sempre o 1º passo e o `raw` (resize + pad 224, cinza → 3 canais)
# é sempre o último. params: sobrescreve parâmetros padrão (literatura, nunca o teste).
experiments:
  E00: {pipeline: raw,        desc: baseline (cinza replicado 3×)}
  E01: {pipeline: spec,       desc: remoção de reflexo especular}
  E02: {pipeline: he,         desc: equalização global}
  E03: {pipeline: clahe,      desc: CLAHE}
  E04: {pipeline: homo,       desc: filtragem homomórfica (FFT)}
  E05: {pipeline: bilat,      desc: filtro bilateral}
  E06: {pipeline: median,     desc: filtro da mediana}
  E07: {pipeline: roi_gt,     desc: recorte pela máscara de ground truth (limite superior)}
  E08: {pipeline: roi,        desc: recorte pela segmentação clássica (melhor método da Fase 3)}
  E09: {pipeline: clahe>roi,  desc: CLAHE + recorte clássico}
  E10: {pipeline: edges,      desc: "[cinza, Sobel, Canny]"}
  E11: {pipeline: lbp,        desc: LBP uniforme}
  E12: {pipeline: m1,         desc: "M1 = [cinza com CLAHE, bordas, LBP]"}
  E13: {pipeline: m2,         desc: "M2 = [cinza, máscara glótica clássica, bordas]"}
  E14: {pipeline: homo>lbp, desc: combinação gulosa (validação interna; ver results/tables/e14_greedy.json)}

stage1:
  experiments: [E00, E01, E02, E03, E04, E05, E06, E07, E08, E09, E10, E11, E12, E13]
  tasks: [A, B]
  models: [probe, simplecnn_fast]
  folds: [0, 1, 2, 3, 4]
  seeds: [0]
  top_k: 4

stage2:
  # E00 + top-4 do Estágio 1 (validação) + E14.
  experiments: [E00, E04, E11, E05, E10, E14]
  tasks: [A, B]
  models: [resnet18, simplecnn]
  folds: [0, 1, 2, 3, 4]
  seeds: [0, 1, 2]

classic_experiments:
  C1: {model: mlp, region: full, mask: classic}
  C2: {model: mlp, region: roi,  mask: classic}
  C3: {model: svm, region: full, mask: classic}
  C4: {model: rf,  region: full, mask: classic}
  C5: {model: mlp, region: full, mask: gt}       # referência superior (forma pelo ground truth)

# Complemento do Estágio 2 só para as hipóteses pré-registradas (DECISIONS.md, 2026-10-24):
# E01 (H1: atenção nos reflexos), E07/E08 (H5: roi × roi_gt). 1 semente; não entra no ranking.
stage2_hyp:
  experiments: [E01, E07, E08]
  tasks: [A, B]
  models: [resnet18, simplecnn]
  folds: [0, 1, 2, 3, 4]
  seeds: [0]
